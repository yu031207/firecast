<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#112B27">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>FIRECAST 산불 도착 시간</title>
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<script src="lib/leaflet/leaflet.js"></script>
<style>
  :root { --dk:#112B27; --mid:#184D3D; --lt:#DDE9E3; --or:#F18B45; --bg:#F5F7F5; --gray:#60746E; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:'Noto Sans KR','Malgun Gothic',sans-serif; background:var(--bg); color:var(--dk); }
  #app { display:flex; height:100%; }
  #panel { width:360px; padding:14px 16px; overflow-y:auto; background:#fff; border-right:1px solid #dce5e0; }
  #map { flex:1; }
  h1 { font-size:20px; margin:0 0 2px; } .sub { color:var(--gray); font-size:12px; margin-bottom:10px; }
  h2 { font-size:13px; margin:14px 0 6px; color:var(--mid); }
  select,input { width:100%; padding:7px; border:1px solid #cfd8d3; border-radius:6px; font-size:14px; }
  .row { display:flex; gap:6px; } .row > * { flex:1; }
  label { font-size:11px; color:var(--gray); display:block; margin:4px 0 2px; }
  button { width:100%; padding:9px; border:0; border-radius:6px; background:var(--lt); color:var(--dk); font-size:14px; font-weight:700; cursor:pointer; margin-top:6px; }
  button.on { background:var(--mid); color:#fff; } button.go { background:var(--or); color:#fff; font-size:16px; padding:12px; }
  #result { margin-top:12px; } .big { font-size:18px; font-weight:800; color:#B33A12; margin:6px 0; }
  .warn { background:#FBE9E7; border-radius:6px; padding:7px 9px; font-size:12px; margin-top:6px; }
  .info { font-size:12px; color:var(--gray); }
  .legend { background:#fff; padding:6px 8px; border-radius:6px; font-size:12px; line-height:1.6; box-shadow:0 1px 4px rgba(0,0,0,.2); }
  .legend i { display:inline-block; width:14px; height:10px; margin-right:5px; }
  @media (max-width:760px) { #app { flex-direction:column-reverse; } #panel { width:100%; height:48%; border-right:0; border-top:1px solid #dce5e0; } #map { height:52%; } }
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <h1>FIRECAST</h1>
    <div class="sub">산불이 우리 집까지 언제 올까? · 시제품 · 강원 전체 · 계산은 이 기기 안에서</div>

    <h2>① 위치 찍기</h2>
    <div class="row">
      <button id="bFire" class="on">🔥 불 난 곳</button>
      <button id="bHome">🏠 우리 집</button>
    </div>
    <button id="bGps">📍 GPS로 우리 집</button>
    <div class="info" id="pos">강원 지도에서 불 난 곳을 누르세요.</div>

    <h2>② 날씨 <span class="info">(🔥 불 난 곳 기준)</span></h2>
    <button id="bKma">기상청 자동 (지금 날씨)</button>
    <label>또는 실제 산불 예시 불러오기</label>
    <select id="example"><option value="">예시 선택</option><option value="nangok">2023 강릉 난곡동 산불 (당시 날씨)</option><option value="yanggu">2022 양구 송청리 산불 (당시 날씨)</option></select>
    <div class="row">
      <div><label>풍향 (불어오는 쪽, °)</label><input id="wd" type="number" value="250"></div>
      <div><label>풍속 (m/s)</label><input id="ws" type="number" step="0.1" value="5"></div>
    </div>
    <div class="row">
      <div><label>기온 (°C)</label><input id="ta" type="number" step="0.1" value="20"></div>
      <div><label>습도 (%)</label><input id="rh" type="number" value="30"></div>
    </div>
    <div class="info" id="wsrc">직접 입력</div>

    <h2>③ 계산</h2>
    <div class="row">
      <div><label>시작 시각</label><input id="start" type="time"></div>
      <div><label>몇 시간 뒤까지</label><input id="hours" type="number" value="6" min="1" max="12"></div>
    </div>
    <button class="go" id="bRun">계산하기</button>

    <div id="result"></div>
  </div>
  <div id="map"></div>
</div>

<script src="lib/proj4.js"></script>
<script src="config.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
